<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Портфолио UX/UI-дизайнера. Избранные проекты.">
  <meta name="theme-color" content="#eeeeee">
  <link rel="icon" href="data:,">
  <title>Портфолио UX/UI-дизайнера</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./scroll.js" defer></script>
  <script src="./header-menu.js" defer></script>
</head>
<body>
  <main id="portfolio" class="hero">
    <div class="viewport">
      <nav class="nav" aria-label="Разделы портфолио">
        <span class="nav-highlight" aria-hidden="true"></span>
        <button class="nav-item" type="button" aria-describedby="nav-unavailable" title="Обо мне">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M5 20v-1a7 5 0 0 1 14 0v1"/>
          </svg>
          <span class="nav-label"><span class="nav-label-text">Обо мне</span></span>
        </button>
        <a class="nav-item" href="#portfolio" aria-current="page" data-selected title="Портфолио">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="7" width="18" height="13" rx="2"/>
            <path d="M8 7V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M3 12a21 21 0 0 0 18 0"/>
          </svg>
          <span class="nav-label"><span class="nav-label-text">Портфолио</span></span>
        </a>
        <button class="nav-item" type="button" aria-describedby="nav-unavailable" title="Контакты">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="m4 7 8 6 8-6"/>
          </svg>
          <span class="nav-label"><span class="nav-label-text">Контакты</span></span>
        </button>
        <span id="nav-unavailable" hidden>Раздел появится позже.</span>
      </nav>

      <div class="scene">
        <div class="backdrop" aria-hidden="true">
          <img class="backdrop-ux" src="./assets/ux-ui.svg" alt="">
          <img class="backdrop-design" src="./assets/design.svg" alt="">
        </div>

        <h1 class="headline">
          <img src="./assets/portfolio.svg" alt="Portfolio">
        </h1>

        <div class="covers" aria-hidden="true">
          <img class="cover" src="./assets/price-index.webp" data-title="Лендинг и онлайн сметы на строительство" alt="">
          <img class="cover" src="./assets/land-search.webp" data-title="Лендинг и сервис по подбору участка" alt="">
          <img class="cover" src="./assets/good-wood.webp" data-title="Telegram mini app" alt="">
          <img class="cover is-active" src="./assets/design-system.webp" data-title="Дизайн система" alt="">
        </div>

        <div class="project">
          <p id="project-title" class="project-title">Дизайн система</p>
          <a class="project-link" role="link" aria-disabled="true" aria-describedby="project-title">
            <span>Смотреть проект</span>
            <img src="./assets/arrow.svg" alt="" width="16" height="16">
          </a>
        </div>
      </div>
    </div>

</html>
